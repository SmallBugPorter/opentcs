server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        autoindex on;
        charset utf-8;
        default_type application/octet-stream;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
        limit_except GET {
            deny all;
        }
    }

    location ~ /\. {
        deny all;
    }
}
