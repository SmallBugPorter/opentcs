# Simulation assumptions, not calibrated physical battery parameters.
battery.consumptionPercentPerMeter=0.01
battery.chargeThresholdPercent=20
battery.resumePercent=100
# Charging rate is set in the Kernel's virtualvehicle.rechargePercentagePerSecond (1.0).

# Rotation limits: degrees/s and degrees/s^2; regenerate XML after changes.
rotation.enabled=true
rotation.maxVelocityDegPerSec=90
rotation.maxAccelerationDegPerSec2=180
rotation.maxDecelerationDegPerSec2=180

# Pickup selection only: estimated travel seconds + queued vehicles * penalty.
pickup.queuePenaltySeconds=8
